Description: Downloads the latest version of IBM MQ Toolkit for macOS.
Identifier: com.github.smithjw.download.IBMMQDevToolkit
MinimumVersion: '2.9'

Input:
  NAME: IBMMQDevToolkit
  SOFTWARE_TITLE: '%NAME%'
  DOWNLOAD_BASE_URL: 'https://public.dhe.ibm.com/ibmdl/export/pub/software/websphere/messaging/mqdev/mactoolkit/'
  DOWNLOAD_MISSING_FILE: null
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: URLTextSearcher
    Arguments:
      url: '%DOWNLOAD_BASE_URL%?C=M;O=D'
      re_pattern: 'href="(?P<pkg_filename>(?P<version>[\d\.]+)-IBM-MQ-DevToolkit-MacOS\.pkg)"'

  - Processor: URLDownloaderPython
    Arguments:
      url: '%DOWNLOAD_BASE_URL%%pkg_filename%'
      filename: '%pkg_filename%'
      download_missing_file: '%DOWNLOAD_MISSING_FILE%'

  - Processor: EndOfCheckPhase

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: CodeSignatureVerifier
    Arguments:
      deep_verification: true
      strict_verification: true
      input_path: '%pathname%'
      expected_authority_names:
        - 'Developer ID Installer: International  Business Machines Corp (PETKK2G752)'
        - Developer ID Certification Authority
        - Apple Root CA

 